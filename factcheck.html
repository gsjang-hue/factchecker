
<!DOCTYPE html>
<!--
  회의 FactCheck  (Gemini STT + Google Search grounding)
  v1.1  2026.08.08  받아쓰기 언어 선택 추가(자동 감지 / 한국어 / English / 日本語 등).
        기존엔 프롬프트가 "한국어로 받아적으세요"로 편향돼 영어 오디오에 한국어가 끼어드는
        문제가 있었음 → 편향 제거하고, 언어 고정 시 "그 언어로만, 번역 금지"로 지시. 자동
        감지는 "들린 언어 그대로, 번역 금지".
  v1.0  2026.08.08  ① 저장기록 상세에 AI 요약 — 회의 narrative 요약 + 뒷부분에 '사실'이 아닌
        판정(거짓·과장·맥락필요·불확실)만 따로 정리(buildFlaggedSection). 요약은 세션에 저장.
        ② 글자크기 조정이 팩트체크 결과 카드에도 적용되도록 --pt-size를 .fc-claim/.fc-reason에 연결.
  v0.9  2026.08.08  translate 앱 기능 이식: ① 저장기록 다중 선택 삭제(선택/전체선택/선택삭제).
        ② 저장기록 상세에 📋복사·📤보내기(navigator.share, 폴백은 .txt 다운로드).
        ③ 사용 기록 — GoatCounter(gsjang 계정) 페이지뷰 + Google Sheets 웹훅(동일 계정,
        app:'factcheck'로 구분). Apps Script를 별도 탭 라우팅으로 갱신하면 factcheck 탭에 적재.
  v0.8  2026.08.08  ① 하이라이트 매칭 견고화 — quote가 원문과 조금 달라도(공백·어미 차이)
        최장 공통 부분문자열로 근사 매칭해 누락 방지(findSpan). ② 자동 스크롤 개선 —
        사용자가 위로 스크롤해 과거를 보는 중이면 새 텍스트가 와도 화면을 끌어내리지 않음
        (맨 아래 근처일 때만 따라감).
  v0.7  2026.08.08  ① 팩트체크 건별 넘버링 — 전사문 하이라이트와 결과 카드에 같은 번호를
        표시해 위치를 한눈에 매칭. ② 문단 분리를 "긴 침묵 + 앞 문단이 문장으로 종결"일
        때만 하도록 바꿔 문장·조사 중간 절단 방지(STT 속도 영향 없음). STT가 문장 끝에
        문장부호를 붙이도록 유도. ③ 판정 안정화 — verify temperature 0 + 판정 기준(rubric)
        명시(핵심 사실이 맞으면 표현 부정확은 거짓 대신 과장/맥락필요).
  v0.6  2026.08.08  받아쓰기 정확도 개선: (1) 조각 크기 확대(침묵 0.5→0.7s·최대 4.5→9s)로
        문장 중간 오절단·문맥부족 오인식 완화. (2) '회의 주제·키워드' 선택 입력 추가 —
        STT 프롬프트에 힌트로 넣어 고유명사·전문용어 인식률을 높임(맥락 에코 없이).
  v0.5  2026.08.08  받아쓰기 품질 개선: (1) 중복 전사 해결 — 조각에 직전 텍스트를 맥락으로
        넘기던 것을 제거(모델이 맥락을 그대로 다시 출력해 중복 발생). (2) 문단 분리를
        조각 단위가 아니라 "긴 침묵(1.5s+)" 기준으로 바꿔, 짧은 쉼으로 잘린 조각은 같은
        문단에 이어붙임(몇 단어씩 쪼개지던 문제 해결).
  v0.4  2026.08.08  ① STT 반응속도 개선(침묵 0.8→0.5s·최대 8→4.5s, 조각 병렬 처리).
        ② 받아쓰기를 문단(.seg) 단위로 표시. ③ 팩트체크 누적 — 재실행 시 이미 검증한
        주장은 건너뛰고 새 주장만 검증(토큰·시간 절약). ④ 전사문에서 팩트체크한 부분을
        판정 색으로 하이라이트(주장 추출 시 원문 quote를 함께 받아 매칭). 전사창을
        textarea→contenteditable div로 교체.
  v0.3  2026.08.08  모델을 Gemini 3세대로 교체(2.5 계열은 신규 사용자 차단·2026.10 종료).
        gemini-3.6-flash(권장)·gemini-3.5-flash-lite(저가)·gemini-3.1-pro(정밀).
        2.5-flash의 한국어 받아쓰기 부정확 문제도 3.6-flash로 개선. 구형 저장 모델값은
        loadSettings에서 무시하고 기본값 유지.
  v0.2  2026.08.08  음성 기록을 Web Speech API → Gemini STT로 교체.
        마이크 오디오를 침묵 기준으로 몇 초 조각으로 잘라(VAD) WAV로 Gemini에 전송해
        받아쓴다. 사파리·모바일 포함 모든 브라우저에서 동작(Web Speech는 Chrome/Edge 전용).
        오디오 캡처·VAD·WAV 인코딩은 translate/ Light 통역앱의 검증된 코드를 재사용.
  v0.1  2026.08.07  최초 버전 (Web Speech API 기반)
        - "팩트체크" 버튼 → 그때까지의 기록에서 검증할 주장 추출(gemini-2.5-flash,
          구조화 JSON) → 주장별 Google Search grounding으로 검증 → 판정/근거/출처 카드
        - 서버·프록시 불필요. 브라우저에서 파일만 열면 동작. API 키는 localStorage 저장.
        - 마이크 미지원/차단 시 기록창에 직접 타이핑/붙여넣기로도 동작.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>회의 FactCheck</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0a1410; color: #f0f0f0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

  /* 탭 */
  .tab-bar { display: flex; border-bottom: 0.5px solid #1a3327; flex-shrink: 0; background: #0a1410; }
  .tab { flex: 1; padding: 11px; font-size: 13px; font-weight: 500; text-align: center; color: #555; border: none; background: transparent; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: #30d158; border-bottom-color: #30d158; }

  .page { display: none; flex: 1; flex-direction: column; overflow: hidden; min-height: 0; }
  .page.active { display: flex; }

  /* 컨트롤 바 */
  .ctrl-bar { padding: 0.5rem 0.8rem; border-bottom: 0.5px solid #1a3327; display: flex; gap: 6px; align-items: center; flex-shrink: 0; background: #0a1410; }
  .ctrl-scroll { flex: 1; min-width: 0; display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; }
  .ctrl-scroll::-webkit-scrollbar { display: none; }
  button { padding: 6px 12px; font-size: 13px; font-weight: 500; border-radius: 7px; border: none; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  #startBtn { background: #30d158; color: #fff; }
  #startBtn:disabled { opacity: 0.35; }
  #stopBtn { background: transparent; color: #ff453a; border: 0.5px solid #ff453a; }
  #stopBtn:disabled { opacity: 0.3; }
  #clearBtn { background: transparent; color: #888; border: 0.5px solid #444; }
  #factBtn { background: #f0c674; color: #1a1400; font-weight: 700; }
  #factBtn:disabled { opacity: 0.4; }
  .ctrl-toggle { background: transparent; border: 0.5px solid #333; border-radius: 7px; color: #888; font-size: 15px; padding: 5px 9px; cursor: pointer; flex-shrink: 0; }
  .ctrl-toggle.open { color: #30d158; border-color: #30d15844; background: #30d15811; }

  /* 설정 패널 */
  .settings { padding: 0.6rem 0.8rem; border-bottom: 0.5px solid #2a2a2a; display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; flex-shrink: 0; background: #131313; overflow: hidden; transition: max-height 0.2s ease, padding 0.2s ease; max-height: 260px; }
  .settings.collapsed { max-height: 0; padding-top: 0; padding-bottom: 0; border-bottom: none; }
  .sg { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
  .sg label { font-size: 10px; color: #666; }
  input[type="password"], input[type="text"], input[type="number"] { background: #1c1c1e; border: 0.5px solid #444; border-radius: 7px; color: #f0f0f0; font-size: 13px; padding: 6px 8px; outline: none; }
  input[type="password"] { width: 210px; }
  input[type="number"] { width: 66px; }
  select { background: #1c1c1e; border: 0.5px solid #444; border-radius: 7px; color: #f0f0f0; font-size: 13px; padding: 6px 8px; outline: none; }
  .set-note { font-size: 10px; color: #555; line-height: 1.5; flex-basis: 100%; }
  .set-note a { color: #8ab4d8; }
  .link-btn { background: transparent; color: #888; border: 0.5px solid #444; border-radius: 7px; padding: 6px 10px; font-size: 12px; }
  .key-hint { font-size: 10px; color: #30d158; margin-top: 4px; min-height: 12px; }
  .version-tag { font-size: 10px; color: #3d3d3d; align-self: flex-end; margin-left: auto; padding-bottom: 2px; letter-spacing: 0.03em; text-align: right; line-height: 1.6; }
  .version-tag .cost { font-size: 9px; color: #30d158; }

  /* 상태바 */
  .statusbar { padding: 5px 1rem; display: flex; align-items: center; gap: 8px; font-size: 11px; color: #777; border-bottom: 0.5px solid #1a1a1a; flex-shrink: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #444; flex-shrink: 0; }
  .dot.recording { background: #ff453a; animation: blink 1s infinite; }
  .dot.working { background: #f0c674; animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }
  .err { color: #ff8a80; margin-left: auto; font-size: 11px; text-align: right; }

  /* 안내 배너 */
  .notice-banner { display:flex; align-items:center; gap:8px; padding:8px 1rem; font-size:12px; flex-shrink:0; line-height:1.5; }
  .notice-banner.hidden { display:none; }
  .notice-banner.info { background:#10202e; color:#8ab4d8; border-bottom:0.5px solid #1e3a52; }
  .notice-banner.warn { background:#2a2410; color:#f0c674; border-bottom:0.5px solid #4a3f1a; }
  .notice-close { background:transparent; border:none; color:inherit; opacity:0.6; font-size:13px; padding:2px 4px; cursor:pointer; margin-left:auto; }

  /* 본문 2단 */
  .work-area { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  .col { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .col.results { flex: 1.15; }
  .divider { width: 0.5px; background: #222; flex-shrink: 0; }
  .col-header { padding: 8px 1rem 7px; font-size: 11px; color: #666; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 0.5px solid #1a1a1a; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .col-body { flex: 1; overflow-y: auto; padding: 0.8rem 1rem; min-height: 0; }

  /* 기록창 */
  #interimLine { font-size: 12px; color: #f0c674; min-height: 16px; padding: 2px 1rem; opacity: 0.85; font-style: italic; flex-shrink: 0; }
  #transcriptBox { min-height: 100%; outline: none; color: #d0ecd0; font-size: var(--pt-size, 15px); line-height: 1.75; word-break: break-word; white-space: pre-wrap; }
  #transcriptBox:empty:before { content: attr(data-ph); color: #3a4a3a; white-space: pre-wrap; }
  #transcriptBox .seg { margin-bottom: 10px; }   /* 받아쓰기 문단 단위 */
  /* 전사문 하이라이트 — 팩트체크한 부분을 판정 색으로 표시 */
  mark.hl { border-radius: 3px; padding: 0 2px; color: inherit; }
  mark.hl-true    { background: #1d3a1d; color: #c6f0c6; }
  mark.hl-false   { background: #3a1414; color: #ffc2bd; }
  mark.hl-exagg   { background: #3a3210; color: #f4d94a; }
  mark.hl-unsure  { background: #12283a; color: #bcdcff; }
  mark.hl-context { background: #241a3a; color: #d9c2ff; }
  .hl-num { font-size: 0.72em; font-weight: 800; vertical-align: super; margin: 0 1px 0 2px; opacity: 0.95; }

  /* 결과 요약 줄 */
  .result-summary { font-size: 12px; color: #aaa; padding: 6px 10px; background: #151515; border: 0.5px solid #262626; border-radius: 8px; margin-bottom: 12px; line-height: 1.6; display: none; }
  .result-summary.show { display: block; }
  .result-summary b { color: #f0f0f0; }

  /* 팩트체크 카드 */
  .fc-card { border: 0.5px solid #262626; border-left-width: 3px; border-radius: 10px; padding: 0.75rem 0.85rem; margin-bottom: 12px; background: #151515; }
  .fc-card.v-true { border-left-color: #30d158; }
  .fc-card.v-false { border-left-color: #ff453a; }
  .fc-card.v-exagg { border-left-color: #f0c674; }
  .fc-card.v-unsure { border-left-color: #8ab4d8; }
  .fc-card.v-context { border-left-color: #b18aff; }
  .fc-num { display: inline-block; min-width: 19px; height: 19px; line-height: 19px; text-align: center; font-size: 11px; font-weight: 700; border-radius: 50%; background: #2c2c2c; color: #ddd; margin-right: 7px; vertical-align: 1px; }
  .fc-badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 5px; padding: 2px 9px; margin-bottom: 8px; letter-spacing: 0.02em; }
  .v-true .fc-badge { background: #1d3a1d; color: #30d158; }
  .v-false .fc-badge { background: #3a1414; color: #ff6b60; }
  .v-exagg .fc-badge { background: #2e2810; color: #f0c674; }
  .v-unsure .fc-badge { background: #12283a; color: #8ab4d8; }
  .v-context .fc-badge { background: #241a3a; color: #b18aff; }
  .fc-claim { font-size: var(--pt-size, 15px); color: #f0f0f0; line-height: 1.6; margin-bottom: 6px; font-weight: 500; word-break: break-word; }
  .fc-reason { font-size: calc(var(--pt-size, 15px) - 2px); color: #b8b8b8; line-height: 1.65; margin-bottom: 8px; word-break: break-word; }
  .fc-sources { display: flex; flex-direction: column; gap: 3px; }
  .fc-sources a { font-size: 11px; color: #8ab4d8; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fc-sources a:hover { text-decoration: underline; }
  .fc-src-label { font-size: 9px; color: #555; letter-spacing: 0.08em; margin-bottom: 2px; }
  .fc-card.loading { color: #666; }
  .fc-spin { font-size: 13px; color: #f0c674; }

  .empty-msg { color: #444; font-size: 13px; text-align: center; padding: 2.5rem 1rem; line-height: 1.7; }

  /* 저장 기록 탭 */
  .saved-page { padding: 1rem; overflow-y: auto; flex: 1; min-height: 0; }
  .session-item { background: #1c1c1e; border: 0.5px solid #2a2a2a; border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .session-item:active { background: #2a2a2a; }
  .session-info { flex: 1; min-width: 0; }
  .session-info .sname { font-size: 14px; font-weight: 500; color: #e0e0e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-info .smeta { font-size: 11px; color: #666; margin-top: 3px; }
  .session-del { font-size: 12px; color: #ff453a; background: transparent; border: 0.5px solid #ff453a44; border-radius: 6px; padding: 4px 9px; cursor: pointer; flex-shrink: 0; }
  .saved-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 12px; color: #666; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .select-toggle-btn { font-size: 12px; color: #888; background: transparent; border: 0.5px solid #444; border-radius: 6px; padding: 4px 11px; cursor: pointer; letter-spacing: 0; text-transform: none; }
  .select-toggle-btn.on { color: #30d158; border-color: #30d15855; background: #30d15811; }
  .bulk-action-bar { display: flex; align-items: center; gap: 10px; padding: 6px 2px; margin-bottom: 8px; }
  .bulk-action-bar.hidden { display: none; }
  .bulk-all-label { font-size: 13px; color: #ccc; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .bulk-del-btn { font-size: 12px; color: #fff; background: #ff453a; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .bulk-del-btn:disabled { background: #ff453a44; color: #ffffff88; cursor: default; }
  .bulk-cancel-btn { font-size: 12px; color: #888; background: transparent; border: 0.5px solid #444; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .session-item.selectable { cursor: pointer; }
  .session-checkbox { width: 18px; height: 18px; flex-shrink: 0; }

  /* 모달 */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: flex; flex-direction: column; }
  .modal-overlay.hidden { display: none; }
  .modal { background: #141414; position: absolute; inset: 0; display: flex; flex-direction: column; }
  .modal-header { padding: 0.8rem 1rem; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; border-bottom: 0.5px solid #2a2a2a; }
  .modal-title { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-close { font-size: 13px; color: #30d158; background: none; border: none; cursor: pointer; padding: 4px 8px; }
  .modal-body { padding: 1rem; overflow-y: auto; flex: 1; }
  .modal-body h4 { font-size: 11px; color: #666; letter-spacing: 0.06em; text-transform: uppercase; margin: 16px 0 8px; }
  .modal-body h4:first-child { margin-top: 0; }
  .modal-transcript { font-size: 13px; color: #cfe0cf; line-height: 1.7; white-space: pre-wrap; word-break: break-word; background: #101810; border: 0.5px solid #1e2e1e; border-radius: 8px; padding: 0.8rem; }
  .modal-actions { padding: 0.75rem 1rem; border-top: 0.5px solid #2a2a2a; display: flex; gap: 8px; flex-shrink: 0; }
  .modal-actions button { flex: 1; }
  .action-btn { font-size: 13px; padding: 9px 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
  .btn-copy { background: #1d3a1d; color: #30d158; border: 0.5px solid #30d15844; }
  .btn-copy.copied { background: #30d158; color: #fff; }
  .btn-download { background: #2c2c2e; color: #f0f0f0; border: 0.5px solid #444; }
  .btn-summarize { background: #30d158; color: #fff; }
  .btn-summarize:disabled { opacity: 0.5; }
  .summary-box { background: #111; border: 0.5px solid #2a2a2a; border-radius: 10px; padding: 0.9rem 1rem; font-size: var(--pt-size, 15px); line-height: 1.8; color: #d5d5d5; white-space: pre-wrap; word-break: break-word; }
  .summary-loading { color: #666; font-size: 13px; padding: 0.5rem 0; }
  .modal-body h4.sum { color: #30d158; }

  @media (max-width: 640px) {
    .settings { flex-direction: row; }
    input[type="password"] { width: 100%; }

</head>
<body>

<!-- ===== 메인 페이지 ===== -->

<script>
"use strict";

/* ===================== 상태 & 저장 ===================== */
const LS = {
  key: 'fc_apikey', model: 'fc_model', max: 'fc_maxclaims',
  font: 'fc_fontsize', sessions: 'fc_sessions', draft: 'fc_draft', topic: 'fc_topic', sttlang: 'fc_sttlang'
};
let recording = false;     // 녹음(STT) 동작 중
let checking = false;      // 팩트체크 진행 중
let lastResults = [];      // 누적 팩트체크 결과 배열(버튼 재실행 시 이어붙임)
let checkedKeys = new Set(); // 이미 검증한 주장 키(중복 검증 방지)
let currentSessionId = null; // 현재 회의 세션(재실행 시 같은 세션 갱신)

/* 익명 사용 기록 — GoatCounter(페이지뷰, <body> 하단 스크립트) + Google Sheets(웹훅).
   translate 앱과 같은 계정·웹훅을 재사용하며, app:'factcheck'로 구분한다. */
const USAGE_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycby-uxXJ58wufxgNxXPWlGf4cxr9iaICGYeyo51EhMOXdakIdXub5KkED9q0aUNtmoCOjA/exec';
let usageSessionId = null, heartbeatInt = null;
function getDeviceId() {
  let id = localStorage.getItem('fc_deviceId');
  if (!id) { id = 'd_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('fc_deviceId', id); }
  return id;
}
function sendUsageEvent(action, extra) {
  if (!USAGE_WEBHOOK_URL) return;
  try {
    const payload = Object.assign({ app: 'factcheck', action, sessionId: usageSessionId, deviceId: getDeviceId() }, extra || {});
    fetch(USAGE_WEBHOOK_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }).catch(() => {});
  } catch (_) {}
}

/* Gemini STT (오디오 배치) — 마이크 오디오를 몇 초 조각으로 잘라 Gemini로 보내 받아쓴다.
   Web Speech API와 달리 사파리·모바일 포함 모든 브라우저에서 동작. */
const SR = 16000;                   // 샘플레이트
const SILENCE_RMS = 0.010;          // 이 미만이면 "조용함"
const SILENCE_MS = 700;             // 이만큼 조용하면 조각 확정(문장 중간 오절단 완화)
const MAX_CHUNK_MS = 9000;          // 침묵 없어도 이 길이면 강제로 끊음(길게 이어 말할 때 정확도↑)
const MIN_CHUNK_MS = 300;           // 이보다 짧으면 침묵으로 끊지 않음
const PRECHUNK_TRIM_MS = 300;       // 발화 시작 전 남겨둘 최근 분량
const PARA_BREAK_MS = 1500;         // 이 이상 쉬면 새 문단으로 분리(짧은 쉼은 같은 문단에 이어붙임)
let stream = null, actx = null, proc = null;
let chunkBuf = [], chunkSamples = 0, silentSamples = 0, hasSpeechInChunk = false;
let interSilence = 0;               // 조각 사이(발화 시작 전) 침묵 누적 — 문단 분리 판단용
let chunkLongPause = true;          // 이번 조각 앞에 긴 침묵이 있었는지(문단 분리 후보)
let watchdog = null;
/* STT 병렬 처리 풀 — 조각을 여러 개 동시에 보내되(속도), 순서대로 화면에 붙인다 */
const STT_CONC = 3;
let chunkQueue = [], sttSeq = 0, sttNext = 0, sttInFlight = 0, sttPending = {};

/* ===================== 유틸 ===================== */
const $ = id => document.getElementById(id);
function setStatus(txt, mode) {
  $('statusText').textContent = txt;
  const dot = $('statusDot');
  dot.className = 'dot' + (mode ? ' ' + mode : '');
}
function setErr(msg) { $('errText').textContent = msg || ''; }
function showNotice(txt, type) {
  const n = $('notice');
  n.className = 'notice-banner ' + (type || 'info');
  $('noticeText').innerHTML = txt;
}
function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ===================== 설정 로드/저장 ===================== */
function showKeySaved(saved) {
  $('keyHint').textContent = saved ? '✅ 저장된 키 사용 중' : '';
}
function loadSettings() {
  $('apiKey').value = localStorage.getItem(LS.key) || '';
  showKeySaved(!!($('apiKey').value.trim()));
  // 저장된 모델이 현재 목록에 있을 때만 적용 (구형 gemini-2.5-* 저장값은 무시하고 기본값 유지)
  const m = localStorage.getItem(LS.model);
  if (m && [...$('model').options].some(o => o.value === m)) $('model').value = m;
  const mx = localStorage.getItem(LS.max); if (mx) $('maxClaims').value = mx;
  const sl = localStorage.getItem(LS.sttlang); if (sl) $('sttLang').value = sl;
  $('topicHint').value = localStorage.getItem(LS.topic) || '';
  const f = localStorage.getItem(LS.font) || '15'; $('fontSize').value = f;
  applyFontSize();
  const draft = localStorage.getItem(LS.draft);
  if (draft) { setTranscript(draft); updateCharCount(); }
}
function saveSettings() {
  const k = $('apiKey').value.trim();
  localStorage.setItem(LS.key, k);
  localStorage.setItem(LS.model, $('model').value);
  localStorage.setItem(LS.max, $('maxClaims').value);
  localStorage.setItem(LS.topic, $('topicHint').value.trim());
  localStorage.setItem(LS.sttlang, $('sttLang').value);
  showKeySaved(!!k);
}
function applyFontSize() {
  const f = $('fontSize').value;
  document.documentElement.style.setProperty('--pt-size', f + 'px');
  localStorage.setItem(LS.font, f);
}
function clearApiKey() {
  if (!confirm('저장된 API 키를 삭제할까요?')) return;
  localStorage.removeItem(LS.key); $('apiKey').value = ''; showKeySaved(false);
}
function toggleSettings() {
  $('settings').classList.toggle('collapsed');
  $('setToggle').classList.toggle('open');
}

/* ===================== 탭 ===================== */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  $('page-main').classList.toggle('active', name === 'main');
  $('page-saved').classList.toggle('active', name === 'saved');
  if (name === 'saved') renderSaved();
}

/* ===================== 기록창 ===================== */
// 전사문 전체를 평문으로 얻는다(문단 사이 줄바꿈 포함)
function getTranscript() {
  const box = $('transcriptBox');
  const lines = [];
  box.childNodes.forEach(node => {
    if (node.nodeType === 3) { const t = (node.textContent || '').trim(); if (t) lines.push(t); return; }
    if (node.nodeType === 1) {
      const clone = node.cloneNode(true);
      if (clone.querySelectorAll) clone.querySelectorAll('.hl-num').forEach(n => n.remove());
      const t = (clone.textContent || '').trim();
      if (t) lines.push(t);
    }
  });
  return lines.join('\n').trim();
}
// 평문을 문단(.seg) 단위로 그려 넣는다
function setTranscript(text) {
  const box = $('transcriptBox'); box.innerHTML = '';
  (text || '').split('\n').forEach(line => {
    if (line.trim() === '') return;
    const d = document.createElement('div'); d.className = 'seg'; d.textContent = line;
    box.appendChild(d);
  });
}
function onTranscriptEdit() { updateCharCount(); localStorage.setItem(LS.draft, getTranscript()); }
function updateCharCount() {
  const n = getTranscript().length;
  $('charCount').textContent = n ? n.toLocaleString() + '자' : '';
}
// 문장이 끝난 것으로 보이는지(문단 분리 판단용). 문장부호 또는 흔한 한국어 종결어미로 끝나면 true.
function endsSentence(s) {
  const t = (s || '').trim();
  if (/[.?!…]["'”’)]?$/.test(t)) return true;
  return /(습니다|습니까|됩니다|합니다|입니다|해요|에요|예요|어요|아요|겠죠|거죠|잖아요|네요|는데요|다|요|죠|까|군요|랍니다|더라고요)$/.test(t);
}
// 받아쓴 조각을 추가한다. longPause(직전 긴 침묵)가 있고 앞 문단이 문장으로 끝났을 때만 새 문단.
function appendFinal(text, longPause) {
  const t = text.trim(); if (!t) return;
  const box = $('transcriptBox');
  const sc = box.closest('.col-body');
  // 추가 전에 사용자가 맨 아래 근처였는지 확인(위로 스크롤해 과거를 보는 중이면 따라가지 않음)
  const atBottom = sc ? (sc.scrollHeight - sc.scrollTop - sc.clientHeight < 40) : true;
  const last = box.lastElementChild;
  const hasLast = last && last.classList && last.classList.contains('seg') && !last.querySelector('mark');
  let newPara = !hasLast;
  if (hasLast) {
    const prev = last.textContent.trim();
    // 긴 침묵이 있어도 앞 문단이 문장으로 끝났을 때만 문단을 나눈다(문장·조사 중간 절단 방지).
    if (longPause && endsSentence(prev)) newPara = true;
    // 안전장치: 한 문단이 너무 길어지면 침묵 지점에서 끊는다.
    if (longPause && prev.length > 220) newPara = true;
  }
  if (newPara) {
    const d = document.createElement('div'); d.className = 'seg'; d.textContent = t;
    box.appendChild(d);
  } else {
    last.textContent = (last.textContent + ' ' + t).replace(/\s+/g, ' ').trim();
  }
  if (sc && atBottom) sc.scrollTop = sc.scrollHeight;   // 맨 아래에 있을 때만 자동 스크롤
  onTranscriptEdit();
}

/* ===================== Gemini STT (오디오 → 받아쓰기) ===================== */
const STT_LANG_NAME = { ko: '한국어', en: '영어', ja: '일본어', zh: '중국어', es: '스페인어', de: '독일어', fr: '프랑스어' };
function sttPrompt(hint, lang) {
  const langLine = (lang && lang !== 'auto' && STT_LANG_NAME[lang])
    ? '- 이 오디오는 주로 ' + STT_LANG_NAME[lang] + '입니다. 반드시 ' + STT_LANG_NAME[lang] + '로만 받아적고, 다른 언어로 번역하거나 다른 언어 문장을 끼워 넣지 마세요(고유명사·짧은 외국어 인용은 원문 그대로 허용).\n'
    : '- 발화된 언어 그대로 받아적고, 절대 다른 언어로 번역하지 마세요(영어면 영어로, 한국어면 한국어로). 한 조각 안에서 언어를 임의로 바꾸지 마세요.\n';
  return '당신은 회의 받아쓰기(STT) 전문가입니다. 첨부된 오디오 조각을 듣고 실제로 들린 말을 그대로 정확히 받아적으세요.\n' +
    langLine +
    '- 이 오디오는 긴 회의를 몇 초 단위로 자른 조각이라 문장이 중간에서 시작되거나 끝날 수 있습니다. 있는 그대로 받아적으세요.\n' +
    '- 숫자·날짜·고유명사·전문용어를 정확히 표기하세요.\n' +
    '- 한 문장이 완결되면 끝에 마침표(.)·물음표(?)·느낌표(!)를 붙이고, 문장 중간에서 잘린 것 같으면 문장부호를 붙이지 마세요.\n' +
    (hint ? '- 이 회의의 주제와 자주 등장하는 고유명사/용어: ' + hint + '. 발음이 이 용어들과 비슷하면 반드시 이 표기로 받아적으세요.\n' : '') +
    '- 의미 있는 발화가 없으면(침묵·잡음뿐) text를 빈 문자열로 두세요.\n' +
    '- 이 오디오에서 실제로 들린 것만 받아쓰고, 추측으로 앞뒤 내용을 지어내지 마세요.\n' +
    '- 설명·인사 없이 받아쓴 텍스트만 JSON의 text 필드에 담으세요.';
}

// 16bit PCM WAV로 인코딩 후 base64 반환 (Light 통역앱과 동일)
function encodeWAV(samples, sampleRate) {
  const n = samples.length;
  const buffer = new ArrayBuffer(44 + n * 2);
  const view = new DataView(buffer);
  const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  writeStr(0, 'RIFF'); view.setUint32(4, 36 + n * 2, true); writeStr(8, 'WAVE');
  writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  writeStr(36, 'data'); view.setUint32(40, n * 2, true);
  let off = 44;
  for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, samples[i])); view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true); off += 2; }
  let binary = ''; const bytes = new Uint8Array(buffer); const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(binary);
}

async function transcribeChunk(float32) {
  const model = $('model').value;
  const hint = ($('topicHint').value || '').trim();
  const lang = $('sttLang').value || 'auto';
  const base64 = encodeWAV(float32, SR);
  // 주의: 직전 텍스트를 맥락으로 넘기면 모델이 그 내용을 그대로 다시 출력(에코)해 중복이 생겨서 넘기지 않는다.
  const body = {
    systemInstruction: { parts: [{ text: sttPrompt(hint, lang) }] },
    contents: [{ role: 'user', parts: [
      { inlineData: { mimeType: 'audio/wav', data: base64 } }
    ] }],
    generationConfig: {
      temperature: 0,
      responseMimeType: 'application/json',
      responseSchema: { type: 'OBJECT', properties: { text: { type: 'STRING' } }, required: ['text'] }
    }
  };
  const data = await geminiCall(body, model);
  let obj = {}; try { obj = JSON.parse(extractText(data)); } catch (_) {}
  return (obj.text || '').trim();
}

function updateSttStatus() {
  const pending = chunkQueue.length + sttInFlight;
  $('interimLine').textContent = pending
    ? ('⏳ 받아쓰는 중…' + (pending > 1 ? ' (' + pending + ')' : ''))
    : (recording ? '🎙 듣는 중…' : '');
}

// 조각을 최대 STT_CONC개까지 동시에 전송하되, 결과는 순서(id)대로만 화면에 붙인다
function enqueueChunk(f, longPause) { chunkQueue.push({ id: sttSeq++, data: f, longPause: longPause }); pumpStt(); }
function pumpStt() {
  while (sttInFlight < STT_CONC && chunkQueue.length) {
    const item = chunkQueue.shift();
    sttInFlight++;
    transcribeChunk(item.data)
      .then(text => { sttPending[item.id] = { text: text || '', longPause: item.longPause }; })
      .catch(e => { sttPending[item.id] = { text: '', longPause: item.longPause }; setErr('받아쓰기 오류: ' + e.message); })
      .finally(() => { sttInFlight--; flushStt(); pumpStt(); });
  }
  updateSttStatus();
}
function flushStt() {
  while (Object.prototype.hasOwnProperty.call(sttPending, sttNext)) {
    const p = sttPending[sttNext]; delete sttPending[sttNext]; sttNext++;
    if (p && p.text) { appendFinal(p.text, p.longPause); setErr(''); }
  }
  updateSttStatus();
}

function resetChunk() { chunkBuf = []; chunkSamples = 0; silentSamples = 0; hasSpeechInChunk = false; }
function finalizeChunk() {
  if (chunkSamples === 0 || !hasSpeechInChunk) { resetChunk(); return; }
  const merged = new Float32Array(chunkSamples);
  let off = 0; for (const b of chunkBuf) { merged.set(b, off); off += b.length; }
  const trailing = silentSamples;   // 이 조각을 끝낸 후행 침묵 — 다음 조각 gap의 시작점
  const lp = chunkLongPause;
  resetChunk();
  interSilence = trailing;          // 다음 발화 전까지 침묵을 계속 더해 문단 분리 판단
  chunkLongPause = false;
  enqueueChunk(merged, lp);
}
function flushPendingChunk() {
  if (chunkSamples > 0 && hasSpeechInChunk) finalizeChunk();
  else resetChunk();
}

// 침묵 감지로 문장 경계 근처에서 오디오를 자른다
function startMicProcessor() {
  const src = actx.createMediaStreamSource(stream);
  proc = actx.createScriptProcessor(2048, 1, 1);
  const silenceSamples = Math.round(SR * SILENCE_MS / 1000);
  const maxSamples = Math.round(SR * MAX_CHUNK_MS / 1000);
  const minSamples = Math.round(SR * MIN_CHUNK_MS / 1000);
  const preTrimSamples = Math.round(SR * PRECHUNK_TRIM_MS / 1000);
  const paraBreakSamples = Math.round(SR * PARA_BREAK_MS / 1000);
  proc.onaudioprocess = ev => {
    const data = ev.inputBuffer.getChannelData(0);
    let sum = 0; for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
    const rms = Math.sqrt(sum / data.length);
    chunkBuf.push(new Float32Array(data)); chunkSamples += data.length;
    if (rms < SILENCE_RMS) {
      silentSamples += data.length;
      if (!hasSpeechInChunk) interSilence += data.length;   // 발화 시작 전 침묵 누적
    } else {
      if (!hasSpeechInChunk) {                               // 이 조각의 첫 발화 시작
        chunkLongPause = interSilence >= paraBreakSamples;   // 직전 쉼이 길었는지 기록
        hasSpeechInChunk = true;
      }
      silentSamples = 0;
    }
    if (hasSpeechInChunk && silentSamples >= silenceSamples && chunkSamples >= minSamples) { finalizeChunk(); return; }
    if (chunkSamples >= maxSamples) { finalizeChunk(); return; }
    if (!hasSpeechInChunk && chunkSamples > SR * 3) {
      const merged = new Float32Array(chunkSamples);
      let off = 0; for (const b of chunkBuf) { merged.set(b, off); off += b.length; }
      chunkBuf = [merged.slice(-preTrimSamples)]; chunkSamples = chunkBuf[0].length; silentSamples = chunkSamples;
    }
  };
  src.connect(proc); proc.connect(actx.destination);
}

async function startRec() {
  if (recording) return;
  const key = (localStorage.getItem(LS.key) || '').trim();
  if (!key) { if ($('settings').classList.contains('collapsed')) toggleSettings(); setErr('먼저 API 키를 입력하세요'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showNotice('이 브라우저는 마이크 입력을 지원하지 않습니다. 회의 내용을 <b>직접 입력/붙여넣기</b> 하세요.', 'warn'); return;
  }
  setErr('');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: SR, channelCount: 1, echoCancellation: true, noiseSuppression: true }, video: false });
  } catch (e) {
    setErr('마이크 권한 필요: ' + e.message);
    showNotice('마이크 사용이 차단되어 음성 기록을 쓸 수 없습니다. 회의 내용을 <b>직접 입력/붙여넣기</b> 한 뒤 팩트체크하세요.', 'warn');
    return;
  }
  actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SR });
  try { if (actx.state === 'suspended') await actx.resume(); } catch (_) {}
  chunkBuf = []; chunkSamples = 0; silentSamples = 0; hasSpeechInChunk = false;
  chunkQueue = []; sttSeq = 0; sttNext = 0; sttInFlight = 0; sttPending = {};
  interSilence = SR * 10; chunkLongPause = true;   // 첫 발화는 새 문단으로 시작
  startMicProcessor();
  recording = true;
  usageSessionId = 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  sendUsageEvent('start', { model: $('model').value });
  heartbeatInt = setInterval(() => sendUsageEvent('heartbeat'), 300000);
  $('startBtn').disabled = true; $('stopBtn').disabled = false;
  setStatus('🎙 기록 중… 말하면 몇 초 뒤 자동으로 적힙니다', 'recording');
  updateSttStatus();
  // Safari/iOS 등에서 오디오 컨텍스트가 조용히 정지되면 되살린다
  watchdog = setInterval(() => { if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (_) {} } }, 1500);
}

function stopRec() {
  if (!recording) return;
  recording = false;
  sendUsageEvent('stop');
  usageSessionId = null;
  if (heartbeatInt) { clearInterval(heartbeatInt); heartbeatInt = null; }
  flushPendingChunk();
  if (proc) { try { proc.disconnect(); } catch (_) {} proc = null; }
  if (actx) { try { actx.close(); } catch (_) {} actx = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (watchdog) { clearInterval(watchdog); watchdog = null; }
  $('startBtn').disabled = false; $('stopBtn').disabled = true;
  setStatus(chunkQueue.length || sttInFlight ? '남은 조각을 받아쓰는 중…' : '일시정지 — 이어서 기록하거나 팩트체크하세요');
  updateSttStatus();
}
function clearRec() {
  if (getTranscript() && !confirm('현재 기록과 팩트체크 결과를 모두 지울까요?')) return;
  $('transcriptBox').innerHTML = ''; onTranscriptEdit();
  $('resultCards').innerHTML = '<div class="empty-msg">회의 기록을 남긴 뒤<br><b>🔍 팩트체크</b> 버튼을 누르면<br>검증할 주장을 뽑아 인터넷 검색으로 확인해 드립니다.</div>';
  $('resultSummary').classList.remove('show');
  lastResults = []; checkedKeys = new Set(); currentSessionId = null;
}

/* ===================== Gemini 호출 ===================== */
function apiUrl(model) {
  const key = localStorage.getItem(LS.key) || '';
  return 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(key);
}
async function geminiCall(body, model) {
  const res = await fetch(apiUrl(model), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    let detail = '';
    try { const j = await res.json(); detail = j.error && j.error.message ? j.error.message : ''; } catch (_) {}
    throw new Error('HTTP ' + res.status + (detail ? ' — ' + detail : ''));
  }
  return res.json();
}
function extractText(data) {
  try { return (data.candidates[0].content.parts || []).map(p => p.text || '').join(''); }
  catch (_) { return ''; }
}
function extractSources(data) {
  const out = [];
  try {
    const chunks = data.candidates[0].groundingMetadata.groundingChunks || [];
    for (const c of chunks) {
      if (c.web && c.web.uri) out.push({ uri: c.web.uri, title: c.web.title || c.web.uri });
    }
  } catch (_) {}
  return out;
}

/* ── Pass A: 검증할 주장 추출 ── */
async function extractClaims(transcript, model, max, exclude) {
  const excludeBlock = (exclude && exclude.length)
    ? '\n\n[이미 검증이 끝난 주장] 아래와 같은 내용은 절대 다시 포함하지 말고, 새로 등장한 내용만 뽑아라:\n- ' + exclude.join('\n- ') + '\n'
    : '';
  const prompt =
    '다음은 한국어 회의를 받아쓴 기록이다. 이 중에서 "사실 여부를 인터넷 검색으로 검증할 가치가 있는 주장"만 골라라.\n' +
    '- 숫자·통계·날짜·고유명사·역사적/과학적 사실·인용·시장 데이터 등 객관적으로 확인 가능한 사실 주장만 선택\n' +
    '- 개인 의견, 감정 표현, 미래 계획/다짐, 애매한 잡담, 인사말은 제외\n' +
    '- claim: 그 자체로 검색 가능하도록 완결된 한 문장으로 다시 써라\n' +
    '- quote: 그 주장의 근거가 된 부분을 회의 원문에서 "그대로 복사"해서 넣어라(수정·요약·재작성 금지, 원문 문구 그대로여야 화면 표시에 쓰인다)\n' +
    '- 중요도가 높은 순으로 최대 ' + max + '개까지\n' +
    '- 검증할 만한 주장이 없으면 빈 배열을 반환' + excludeBlock + '\n\n' +
    '회의 기록:\n"""\n' + transcript + '\n"""';
  const body = {
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: {
      temperature: 0.2,
      responseMimeType: 'application/json',
      responseSchema: {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: { claim: { type: 'STRING' }, quote: { type: 'STRING' }, context: { type: 'STRING' } },
          required: ['claim']
        }
      }
    }
  };
  const data = await geminiCall(body, model);
  let arr = [];
  try { arr = JSON.parse(extractText(data)); } catch (_) {}
  if (!Array.isArray(arr)) arr = [];
  return arr.filter(x => x && x.claim).slice(0, max);
}

/* ── Pass B: 주장 1건을 Google 검색으로 검증 ── */
const VERDICTS = {
  '사실': { cls: 'v-true', hl: 'hl-true' }, '거짓': { cls: 'v-false', hl: 'hl-false' },
  '과장': { cls: 'v-exagg', hl: 'hl-exagg' }, '불확실': { cls: 'v-unsure', hl: 'hl-unsure' },
  '맥락필요': { cls: 'v-context', hl: 'hl-context' }
};

/* ── 전사문 하이라이트: 각 결과의 원문 quote를 찾아 판정 색 + 번호로 감싼다 ── */
function buildMarks(results) {
  return (results || []).map((r, i) => ({ num: i + 1, quote: (r.quote || '').trim(), cls: (VERDICTS[r.verdict] || VERDICTS['불확실']).hl }))
    .filter(m => m.quote);
}
// 전사문에서 quote 위치를 찾는다. 정확히 없으면 공백 무시 + 최장 공통 부분문자열로 근사 매칭.
// (모델이 준 quote가 원문과 조금 달라도 겹치는 부분을 하이라이트하기 위함)
function findSpan(text, quote) {
  if (!quote) return null;
  const idx = text.indexOf(quote);
  if (idx >= 0) return [idx, idx + quote.length];
  const norm = s => { let o = ''; const map = []; for (let i = 0; i < s.length; i++) { if (/\s/.test(s[i])) continue; o += s[i]; map.push(i); } return { o, map }; };
  const P = norm(text), Q = norm(quote);
  const a = P.o, b = Q.o;
  if (!a.length || !b.length) return null;
  let best = 0, bestA = -1;
  const prev = new Array(b.length + 1).fill(0);
  for (let i = 1; i <= a.length; i++) {
    let diag = 0;
    for (let j = 1; j <= b.length; j++) {
      const tmp = prev[j];
      if (a[i - 1] === b[j - 1]) { prev[j] = diag + 1; if (prev[j] > best) { best = prev[j]; bestA = i - prev[j]; } }
      else prev[j] = 0;
      diag = tmp;
    }
  }
  if (best < Math.max(5, Math.floor(b.length * 0.4))) return null;   // 겹침이 너무 적으면 매칭 실패로 간주
  return [P.map[bestA], P.map[bestA + best - 1] + 1];
}
// 한 문단 안에서 marks를 겹치지 않게 감싸 HTML 반환(끝에 번호 표시)
function highlightPara(para, marks) {
  let segs = [{ text: para, cls: null, num: 0 }];
  for (const m of marks) {
    const next = [];
    for (const s of segs) {
      if (s.cls) { next.push(s); continue; }
      const span = findSpan(s.text, m.quote);
      if (!span) { next.push(s); continue; }
      const [start, end] = span;
      if (start > 0) next.push({ text: s.text.slice(0, start), cls: null, num: 0 });
      next.push({ text: s.text.slice(start, end), cls: m.cls, num: m.num });
      const rest = s.text.slice(end);
      if (rest) next.push({ text: rest, cls: null, num: 0 });
    }
    segs = next;
  }
  return segs.map(s => s.cls
    ? '<mark class="hl ' + s.cls + '">' + esc(s.text) + '<sup class="hl-num">' + s.num + '</sup></mark>'
    : esc(s.text)).join('');
}
function highlightedParas(text, results) {
  const marks = buildMarks(results);
  return (text || '').split('\n').filter(p => p.trim() !== '')
    .map(p => '<div class="seg">' + highlightPara(p, marks) + '</div>').join('');
}
function highlightTranscript(results) {
  const text = getTranscript(); if (!text) return;
  $('transcriptBox').innerHTML = highlightedParas(text, results);
}
function claimKey(x) { return ((x && (x.quote || x.claim)) || '').replace(/\s+/g, '').toLowerCase(); }
async function verifyClaim(item, model) {
  const prompt =
    '다음 "주장"이 사실인지 Google 검색으로 확인하고 판정하라.\n' +
    '주장: "' + item.claim + '"\n' +
    (item.context ? '회의 맥락: ' + item.context + '\n' : '') +
    '\n판정 기준(아래 정의를 엄격히 따를 것):\n' +
    '- 사실: 핵심 내용이 검색 근거와 일치함\n' +
    '- 거짓: 핵심 사실 자체가 근거와 명백히 어긋남(핵심이 맞으면 표현이 다소 부정확해도 거짓으로 판정하지 말 것)\n' +
    '- 과장: 방향·핵심은 맞으나 수치나 정도가 부풀려짐\n' +
    '- 맥락필요: 대체로 맞지만 중요한 조건·맥락이 빠져 오해의 소지가 있음\n' +
    '- 불확실: 신뢰할 만한 근거를 찾지 못함\n' +
    '\n반드시 아래 형식으로만, 한국어로 답하라:\n' +
    '판정: <사실|거짓|과장|불확실|맥락필요 중 정확히 하나>\n' +
    '근거: <검색 결과에 근거한 1~2문장 설명>\n\n' +
    '규칙: 최신·정확한 정보를 검색해 판단할 것. 판정 단어는 반드시 5개 중 하나만 쓸 것. 주장을 문자 그대로 평가하되, 핵심 사실의 진위를 우선할 것.';
  const body = {
    contents: [{ parts: [{ text: prompt }] }],
    tools: [{ google_search: {} }],
    generationConfig: { temperature: 0 }
  };
  const data = await geminiCall(body, model);
  const text = extractText(data);
  const sources = extractSources(data);
  // 판정/근거 파싱
  let verdict = '불확실', reason = text.trim();
  const vm = text.match(/판정\s*[:：]\s*\[?\s*(사실|거짓|과장|불확실|맥락필요)/);
  if (vm) verdict = vm[1];
  const rm = text.match(/근거\s*[:：]\s*([\s\S]+)/);
  if (rm) reason = rm[1].trim();
  return { claim: item.claim, quote: item.quote || '', verdict, reason, sources };
}

/* ── 팩트체크 실행 (누적: 이미 검증한 주장은 건너뛰고 새 주장만) ── */
async function runFactcheck() {
  if (checking) return;
  const key = (localStorage.getItem(LS.key) || '').trim();
  if (!key) { if ($('settings').classList.contains('collapsed')) toggleSettings(); setErr('먼저 API 키를 입력하세요'); return; }
  const transcript = getTranscript();
  if (transcript.length < 5) { setErr('회의 기록이 비어 있습니다'); return; }

  const model = $('model').value;
  const max = Math.max(1, Math.min(30, parseInt($('maxClaims').value) || 10));
  checking = true; setErr('');
  $('factBtn').disabled = true;
  const cards = $('resultCards');
  const ph = cards.querySelector('.empty-msg'); if (ph) ph.remove();   // 첫 실행 시 안내문 제거
  const spin = document.createElement('div'); spin.className = 'fc-spin'; spin.textContent = '🧠 새로 검증할 주장을 찾는 중…';
  cards.appendChild(spin);

  try {
    setStatus('🧠 검증할 주장을 찾는 중…', 'working');
    const exclude = lastResults.map(r => r.claim);
    let claims = await extractClaims(transcript, model, max, exclude);
    claims = claims.filter(c => !checkedKeys.has(claimKey(c)));   // 클라이언트 측 중복 제거
    spin.remove();

    if (!claims.length) {
      if (!lastResults.length) cards.innerHTML = '<div class="empty-msg">검증할 만한 사실 주장을 찾지 못했습니다.<br>내용을 더 기록한 뒤 다시 시도해 보세요.</div>';
      setStatus(lastResults.length ? '완료 — 새로 검증할 주장이 없습니다 (누적 ' + lastResults.length + '건)' : '완료 — 검증할 주장 없음');
      return;
    }

    // 새 주장 카드만 추가 생성(기존 카드는 유지). 번호는 누적 순서(base+i+1)로 매긴다.
    const base = lastResults.length;
    const nodes = claims.map((c, i) => {
      const d = document.createElement('div');
      d.className = 'fc-card loading';
      d.innerHTML = '<span class="fc-num">' + (base + i + 1) + '</span><span class="fc-claim" style="display:inline">' + esc(c.claim) + '</span><div class="fc-spin">🔍 검색·검증 중…</div>';
      cards.appendChild(d); return d;
    });

    const results = new Array(claims.length);
    let done = 0; const CONC = 3; let idx = 0;
    async function worker() {
      while (idx < claims.length) {
        const i = idx++;
        try { results[i] = await verifyClaim(claims[i], model); }
        catch (e) { results[i] = { claim: claims[i].claim, quote: claims[i].quote || '', verdict: '불확실', reason: '검증 실패: ' + e.message, sources: [] }; }
        done++;
        renderCard(nodes[i], results[i], base + i + 1);
        setStatus('🔍 인터넷 검색으로 검증 중… (' + done + '/' + claims.length + ')', 'working');
      }
    }
    setStatus('🔍 인터넷 검색으로 검증 중… (0/' + claims.length + ')', 'working');
    await Promise.all(Array.from({ length: Math.min(CONC, claims.length) }, worker));

    lastResults = lastResults.concat(results);            // 누적
    results.forEach(r => checkedKeys.add(claimKey(r)));
    renderSummary(lastResults);
    highlightTranscript(lastResults);                     // 전사문에 판정 색 표시
    saveSession(transcript, lastResults);
    sendUsageEvent('factcheck', { model: model, checked: results.length, total: lastResults.length });
    setStatus('✅ 완료 — 이번 ' + results.length + '건, 누적 ' + lastResults.length + '건');
  } catch (e) {
    spin.remove();
    setErr('오류: ' + e.message);
    if (!lastResults.length) cards.appendChild(Object.assign(document.createElement('div'), { className: 'empty-msg', innerHTML: '팩트체크 중 오류가 발생했습니다.<br>' + esc(e.message) }));
    setStatus('오류 발생');
  } finally {
    checking = false; $('factBtn').disabled = false;
  }
}

function renderCard(node, r, num) {
  const v = VERDICTS[r.verdict] || VERDICTS['불확실'];
  node.className = 'fc-card ' + v.cls;
  let html = '<span class="fc-num">' + num + '</span><span class="fc-badge">' + esc(r.verdict) + '</span>';
  html += '<div class="fc-claim">' + esc(r.claim) + '</div>';
  html += '<div class="fc-reason">' + esc(r.reason) + '</div>';
  if (r.sources && r.sources.length) {
    html += '<div class="fc-sources"><div class="fc-src-label">출처</div>';
    for (const s of r.sources.slice(0, 5)) {
      html += '<a href="' + esc(s.uri) + '" target="_blank" rel="noopener">🔗 ' + esc(s.title) + '</a>';
    }
    html += '</div>';
  }
  node.innerHTML = html;
}
function renderSummary(results) {
  const c = { '사실': 0, '거짓': 0, '과장': 0, '불확실': 0, '맥락필요': 0 };
  results.forEach(r => { c[r.verdict] = (c[r.verdict] || 0) + 1; });
  const el = $('resultSummary');
  el.innerHTML = '총 <b>' + results.length + '</b>건 · ' +
    '<b style="color:#30d158">사실 ' + c['사실'] + '</b> · ' +
    '<b style="color:#ff6b60">거짓 ' + c['거짓'] + '</b> · ' +
    '<b style="color:#f0c674">과장 ' + c['과장'] + '</b> · ' +
    '<b style="color:#8ab4d8">불확실 ' + c['불확실'] + '</b> · ' +
    '<b style="color:#b18aff">맥락필요 ' + c['맥락필요'] + '</b>';
  el.classList.add('show');
}

/* ===================== 세션 저장/조회 ===================== */
function loadSessions() { try { return JSON.parse(localStorage.getItem(LS.sessions) || '[]'); } catch (_) { return []; } }
function saveSession(transcript, results) {
  const list = loadSessions();
  const now = new Date();
  const title = transcript.slice(0, 24).replace(/\s+/g, ' ') + (transcript.length > 24 ? '…' : '');
  const rec = {
    id: currentSessionId || ('fc_' + now.getTime()),
    title: title || '(제목 없음)',
    date: now.toLocaleString('ko-KR'),
    transcript, results
  };
  currentSessionId = rec.id;
  const i = list.findIndex(s => s.id === rec.id);
  if (i >= 0) list[i] = rec; else list.unshift(rec);   // 재실행 시 같은 세션 갱신(누적)
  // 저장 용량 보호: 최근 30개까지
  try { localStorage.setItem(LS.sessions, JSON.stringify(list.slice(0, 30))); }
  catch (_) { localStorage.setItem(LS.sessions, JSON.stringify(list.slice(0, 10))); }
}
/* ── 선택 삭제(다중 선택) ── */
let selectMode = false;
const selectedIds = new Set();
function toggleSelectMode() {
  selectMode = !selectMode; selectedIds.clear();
  const btn = $('selectToggleBtn'), bar = $('bulkActionBar');
  btn.textContent = selectMode ? '완료' : '선택';
  btn.classList.toggle('on', selectMode);
  bar.classList.toggle('hidden', !selectMode);
  const allBox = $('selectAllBox'); if (allBox) allBox.checked = false;
  renderSaved();
}
function toggleSessionSelect(id, checked) { if (checked) selectedIds.add(id); else selectedIds.delete(id); updateBulkDelButton(); }
function toggleSelectAll(checked) { selectedIds.clear(); if (checked) loadSessions().forEach(s => selectedIds.add(s.id)); renderSaved(); }
function updateBulkDelButton() {
  const btn = $('bulkDelBtn'); if (!btn) return;
  btn.textContent = '선택 삭제 (' + selectedIds.size + ')';
  btn.disabled = selectedIds.size === 0;
  const allBox = $('selectAllBox'); const n = loadSessions().length;
  if (allBox) allBox.checked = n > 0 && selectedIds.size === n;
}
function bulkDeleteSelected() {
  if (!selectedIds.size) return;
  if (!confirm(selectedIds.size + '개 기록을 삭제할까요?')) return;
  localStorage.setItem(LS.sessions, JSON.stringify(loadSessions().filter(s => !selectedIds.has(s.id))));
  selectedIds.clear(); renderSaved();
}
function renderSaved() {
  const list = loadSessions();
  const el = $('savedList');
  if (!list.length) { el.innerHTML = '<div class="empty-msg">저장된 팩트체크 기록이 없습니다.</div>'; updateBulkDelButton(); return; }
  el.innerHTML = '';
  list.forEach(s => {
    const n = (s.results || []).length;
    const meta = esc(s.date) + ' · ' + n + '건 검증';
    const item = document.createElement('div');
    if (selectMode) {
      item.className = 'session-item selectable';
      item.innerHTML =
        '<input type="checkbox" class="session-checkbox"' + (selectedIds.has(s.id) ? ' checked' : '') + '>' +
        '<div class="session-info"><div class="sname">' + esc(s.title) + '</div><div class="smeta">' + meta + '</div></div>';
      const cb = item.querySelector('.session-checkbox');
      item.onclick = () => { cb.checked = !cb.checked; toggleSessionSelect(s.id, cb.checked); };
      cb.onclick = (e) => { e.stopPropagation(); toggleSessionSelect(s.id, cb.checked); };
    } else {
      item.className = 'session-item';
      item.innerHTML =
        '<div class="session-info"><div class="sname">' + esc(s.title) + '</div><div class="smeta">' + meta + '</div></div>' +
        '<button class="session-del">삭제</button>';
      item.querySelector('.session-info').onclick = () => openModal(s);
      item.querySelector('.session-del').onclick = (e) => { e.stopPropagation(); deleteSession(s.id); };
    }
    el.appendChild(item);
  });
  updateBulkDelButton();
}
function deleteSession(id) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  const list = loadSessions().filter(s => s.id !== id);
  localStorage.setItem(LS.sessions, JSON.stringify(list));
  renderSaved();
}

/* ── 상세 모달 + 복사/보내기 ── */
let modalSession = null;
function buildSessionText(s) {
  let t = '[회의 FactCheck] ' + s.title + '\n' + s.date + '\n\n';
  if (s.summary) t += '■ AI 요약\n' + s.summary + '\n\n';
  t += '■ 회의 기록\n' + s.transcript + '\n\n';
  t += '■ 팩트체크 결과 (' + (s.results || []).length + '건)\n';
  (s.results || []).forEach((r, i) => {
    t += '\n' + (i + 1) + '. [' + r.verdict + '] ' + r.claim + '\n';
    if (r.reason) t += '   근거: ' + r.reason + '\n';
    if (r.sources && r.sources.length) t += '   출처: ' + r.sources.map(x => x.uri).join(', ') + '\n';
  });
  return t;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (_) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta);
  }
}
async function copyModalSession() {
  if (!modalSession) return;
  await copyText(buildSessionText(modalSession));
  const b = $('modalCopyBtn'), o = b.textContent;
  b.textContent = '✅ 복사됨'; b.classList.add('copied');
  setTimeout(() => { b.textContent = o; b.classList.remove('copied'); }, 1500);
}
async function shareModalSession() {
  if (!modalSession) return;
  const text = buildSessionText(modalSession);
  const title = '회의 FactCheck — ' + modalSession.title;
  if (navigator.share) { try { await navigator.share({ title, text }); return; } catch (_) {} }
  // 폴백: 텍스트 파일로 다운로드
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = (modalSession.title || 'factcheck').replace(/[\\/:*?"<>|]/g, '_').slice(0, 40) + '.txt';
  a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function renderModalSummary(text) {
  const box = $('modalSummaryBox'); if (!box) return;
  box.innerHTML = text
    ? '<div class="summary-box">' + esc(text) + '</div>'
    : '<div class="summary-loading">아직 요약이 없습니다. 아래 <b>✨ AI 요약</b> 버튼을 누르세요.</div>';
}
function openModal(s) {
  modalSession = s;
  $('modalTitle').textContent = s.title;
  let html = '<h4 class="sum">✨ AI 요약</h4><div id="modalSummaryBox"></div>';
  html += '<h4>회의 기록</h4><div class="modal-transcript">' + highlightedParas(s.transcript, s.results) + '</div>';
  html += '<h4>팩트체크 결과 (' + (s.results || []).length + '건)</h4>';
  (s.results || []).forEach((r, i) => {
    const v = VERDICTS[r.verdict] || VERDICTS['불확실'];
    html += '<div class="fc-card ' + v.cls + '" style="margin-top:10px">';
    html += '<span class="fc-num">' + (i + 1) + '</span><span class="fc-badge">' + esc(r.verdict) + '</span>';
    html += '<div class="fc-claim">' + esc(r.claim) + '</div>';
    html += '<div class="fc-reason">' + esc(r.reason) + '</div>';
    if (r.sources && r.sources.length) {
      html += '<div class="fc-sources"><div class="fc-src-label">출처</div>';
      r.sources.slice(0, 5).forEach(src => { html += '<a href="' + esc(src.uri) + '" target="_blank" rel="noopener">🔗 ' + esc(src.title) + '</a>'; });
      html += '</div>';
    }
    html += '</div>';
  });
  $('modalBody').innerHTML = html;
  renderModalSummary(s.summary);
  $('modal').classList.remove('hidden');
}
function closeModal() { $('modal').classList.add('hidden'); }

/* ── AI 요약 (저장기록 상세) ── */
async function summarizeTranscript(transcript, model) {
  const prompt =
    '다음은 한국어 회의를 받아쓴 기록이다. 아래 형식 그대로 간결한 한국어 요약을 작성하라(서론·맺음말 없이).\n\n' +
    '[핵심 요약]\n- (3~5개 불릿)\n\n[주요 논의]\n- (주제별 불릿)\n\n[결정·액션 아이템]\n- (있으면 나열, 없으면 "특이사항 없음")\n\n' +
    '회의 기록:\n"""\n' + transcript + '\n"""';
  const data = await geminiCall({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.3 } }, model);
  return (extractText(data) || '(요약 생성 실패)').trim();
}
// 팩트체크 결과 중 '사실'이 아닌 항목만 정리(카드 번호 유지)
function buildFlaggedSection(results) {
  let s = '[⚠️ 사실이 아니거나 확인이 필요한 주장]\n';
  const flagged = (results || []).map((r, i) => ({ r, n: i + 1 })).filter(x => x.r.verdict !== '사실');
  if (!flagged.length) return s + '- 검증된 주장이 모두 "사실"로 판정되었습니다.';
  flagged.forEach(({ r, n }) => {
    s += '\n' + n + '. [' + r.verdict + '] ' + r.claim + '\n';
    if (r.reason) s += '   → ' + r.reason + '\n';
  });
  return s.trim();
}
async function summarizeModal() {
  if (!modalSession) return;
  const key = (localStorage.getItem(LS.key) || '').trim();
  if (!key) { if ($('settings').classList.contains('collapsed')) toggleSettings(); setErr('먼저 API 키를 입력하세요'); return; }
  const btn = $('modalSumBtn'); btn.disabled = true;
  const box = $('modalSummaryBox'); if (box) box.innerHTML = '<div class="summary-loading">✨ 요약 생성 중…</div>';
  try {
    const narrative = await summarizeTranscript(modalSession.transcript, $('model').value);
    const full = narrative + '\n\n' + buildFlaggedSection(modalSession.results);
    modalSession.summary = full;
    const list = loadSessions();
    const i = list.findIndex(x => x.id === modalSession.id);
    if (i >= 0) { list[i].summary = full; localStorage.setItem(LS.sessions, JSON.stringify(list)); }
    renderModalSummary(full);
    sendUsageEvent('summarize', { total: (modalSession.results || []).length });
  } catch (e) {
    if (box) box.innerHTML = '<div class="summary-loading">요약 실패: ' + esc(e.message) + '</div>';
  } finally { btn.disabled = false; }
}

/* ===================== 시작 ===================== */
(function init() {
  loadSettings();
  updateCharCount();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showNotice('이 브라우저는 마이크 입력을 지원하지 않습니다. 회의 내용을 직접 입력/붙여넣기 한 뒤 팩트체크할 수 있습니다.', 'info');
  } else if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.protocol !== 'file:') {
    showNotice('마이크는 <b>https</b> 주소에서만 동작합니다. GitHub Pages(https)로 접속하세요.', 'warn');
  }
  sendUsageEvent('open');
})();
